# render.yaml - Render Blueprint for Honeygain Node with Cloudflare 1.1.1.1 WARP
services:
  - type: web
    name: honeygain-warp-node
    env: docker
    region: frankfurt
    plan: free
    branch: main
    autoDeploy: true
    envVars:
      - key: HNY_EMAIL
        sync: false
      - key: HNY_PASS
        sync: false
      - key: DEVICE_NAME
        value: "Render-Cloudflare-Warp-01"
      - key: CUSTOM_PROXY
        sync: false
      - key: WARP_CONF_BASE64
        sync: false
      - key: WARP_PRIVATE_KEY
        sync: false
      - key: WARP_ADDRESS
        value: "172.16.0.2/32"
