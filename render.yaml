services:
  - type: web
    name: honeygain-render-node
    env: docker
    region: ohio
    plan: free
    branch: main
    autoDeploy: true
    envVars:
      - key: HNY_EMAIL
        sync: false
      - key: HNY_PASS
        sync: false
      - key: DEVICE_NAME
        value: "Honeygain-Render-Node"
      - key: CUSTOM_PROXY
        sync: false
