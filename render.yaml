# render.yaml - Production Blueprint Configuration
services:
  - type: web
    name: armoros-honeygain-node
    env: docker
    region: ohio
    plan: free
    branch: main
    autoDeploy: true
    envVars:
      - key: HNY_EMAIL
        sync: false
      - key: HNY_PASS
        sync: false
      - key: DEVICE_NAME
        value: "ArmorOS-Render-Node-01"
